spring.application.name=privatespace
server.port=8080

# H2 Database (file-based, survives restarts)
spring.datasource.url=jdbc:h2:file:./data/privatespace
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Custom
app.jwt.secret=PrivateSpaceJwtSecretKeyForSrujanAndHisGirlfriend2026LongEnough
app.jwt.expiration=604800000
app.upload.dir=./uploads