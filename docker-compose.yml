services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privatespace-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - APP_UPLOAD_DIR=/app/uploads
      - APP_JWT_SECRET=PrivateSpaceJwtSecretKeyForSrujanAndHisFriend2026LongEnough
    networks:
      - privatespace

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: privatespace-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - privatespace

volumes:
  backend-data:
  backend-uploads:

networks:
  privatespace:
    driver: bridge